<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>건강기록 데이터 구조·백업</title>
<style>
:root{--bg:#faf7f3;--card:#fff;--ink:#2f2a26;--sub:#8a8079;--line:#ece5dd;--sage:#6fae8f;--sage-d:#4f9273;--good:#57a06f;--warn:#e0a94b;--over:#d9748a;--chip:#f3ede6;}
@media (prefers-color-scheme: dark){:root{--bg:#1c1a18;--card:#26231f;--ink:#efe9e2;--sub:#a89e94;--line:#332e29;--chip:#302b25;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;padding:18px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.big{font-size:16px;font-weight:800;margin:0 0 8px}
.k{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.k:last-child{border-bottom:none}
.k b{font-weight:700}
.banner{border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-bottom:14px}
.banner.ok{background:rgba(87,160,111,.15);color:var(--good);border:1px solid rgba(87,160,111,.35)}
.banner.warn{background:rgba(224,169,75,.16);color:#b7861f;border:1px solid rgba(224,169,75,.4)}
.banner.bad{background:rgba(217,116,138,.15);color:var(--over);border:1px solid rgba(217,116,138,.4)}
button{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:12px;padding:14px;width:100%;cursor:pointer;margin-top:10px}
.btn{background:var(--sage);color:#fff}
.btn2{background:var(--chip);color:var(--ink)}
textarea{width:100%;height:130px;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.note{background:var(--chip);border-radius:12px;padding:12px;font-size:13px;color:var(--sub);margin-top:8px}
.hi{color:var(--over);font-weight:800}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛟 건강기록 데이터 구조·백업</h1>
  <p class="sub">이 페이지는 <b>동기화를 하지 않습니다.</b> 이 폰에 저장된 데이터만 읽어서 보여주고 백업 파일로 저장해요. 클라우드는 전혀 건드리지 않으니 안심하세요.</p>
  <div id="out"></div>
</div>
<script>
"use strict";
/* 이 페이지에는 Supabase·동기화·쓰기 코드가 전혀 없습니다. localStorage는 오직 읽기만 합니다. */
var KEY='preg_health_v1';
var out=document.getElementById('out');

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function cnt(o){return (o&&typeof o==='object')?Object.keys(o).length:0;}
function allDates(db){
  var s={};
  (db.weight||[]).forEach(function(w){if(w&&w.date)s[w.date]=1;});
  ['diet','exercise','water','stool','suppLog'].forEach(function(k){
    var m=db[k]; if(m&&typeof m==='object') Object.keys(m).forEach(function(d){s[d]=1;});
  });
  return Object.keys(s).sort();
}

var raw=null;
try{ raw=localStorage.getItem(KEY); }catch(e){}

if(!raw){
  out.innerHTML='<div class="banner bad">이 폰(이 브라우저)에는 저장된 건강기록 데이터가 없어요.</div>'
   +'<div class="note">가능한 원인: ① 이미 빈 클라우드와 동기화되어 로컬도 비워짐, ② 다른 브라우저/앱아이콘으로 앱을 열었었음(Safari↔Chrome, 홈화면 아이콘 등은 저장소가 다를 수 있어요). '
   +'<br><br><b>다른 브라우저로도 이 페이지를 한 번씩 열어보세요.</b> (평소 앱을 열던 바로 그 브라우저/아이콘에서 여는 게 중요해요.)</div>';
} else {
  var db=null, perr=null;
  try{ db=JSON.parse(raw); }catch(e){ perr=e; }
  if(!db){
    out.innerHTML='<div class="banner bad">데이터가 있는데 형식을 읽지 못했어요.</div>'
     +'<div class="note">아래 원문을 전체 선택해 복사한 뒤 저에게 보내주세요.</div>'
     +'<textarea readonly>'+esc(raw)+'</textarea>';
  } else {
    var dates=allDates(db);
    var latest=dates.length?dates[dates.length-1]:'(없음)';
    var earliest=dates.length?dates[0]:'(없음)';
    var has1420 = dates.some(function(d){return d>='2026-08-14';});
    var upd=db.updatedAt?new Date(db.updatedAt).toLocaleString('ko-KR'):'(없음)';

    var banner = has1420
      ? '<div class="banner ok">✅ 8/14 이후 기록이 있어요! (최신 기록일: <b>'+esc(latest)+'</b>)<br>아래 <b>"백업 파일로 저장"</b>을 눌러 저장한 뒤, 그 파일을 대화에 보내주세요.</div>'
      : '<div class="banner warn">이 폰의 데이터에는 8/14 이후 기록이 안 보여요. (마지막 기록일: <b>'+esc(latest)+'</b>)<br>그래도 이 백업은 저장해 두세요. 혹시 다른 브라우저/아이콘에 최신본이 있을 수 있으니 그쪽도 열어보세요.</div>';

    var wN=(db.weight||[]).length;
    var rows=''
     +'<div class="k"><span>마지막 저장 시각</span><b>'+esc(upd)+'</b></div>'
     +'<div class="k"><span>기록 있는 날짜 범위</span><b>'+esc(earliest)+' ~ '+esc(latest)+'</b></div>'
     +'<div class="k"><span>체중</span><b>'+wN+'건</b></div>'
     +'<div class="k"><span>식단 기록일</span><b>'+cnt(db.diet)+'일</b></div>'
     +'<div class="k"><span>운동 기록일</span><b>'+cnt(db.exercise)+'일</b></div>'
     +'<div class="k"><span>물 기록일</span><b>'+cnt(db.water)+'일</b></div>'
     +'<div class="k"><span>배변 기록일</span><b>'+cnt(db.stool)+'일</b></div>'
     +'<div class="k"><span>영양제 복용일</span><b>'+cnt(db.suppLog)+'일</b></div>';

    out.innerHTML = banner
      + '<div class="card"><div class="big">📋 이 폰에 저장된 내용</div>'+rows+'</div>'
      + '<button class="btn" id="dl">💾 백업 파일로 저장</button>'
      + '<button class="btn2" id="cp">📋 전체 내용 복사</button>'
      + '<div class="note">저장이 안 되면 아래 원문을 길게 눌러 <b>전체 선택 → 복사</b>한 뒤 저에게 붙여넣어 보내주세요.</div>'
      + '<textarea id="ta" readonly>'+esc(JSON.stringify(db))+'</textarea>';

    var pretty=JSON.stringify(db,null,2);
    function fname(){ var d=(db.updatedAt?new Date(db.updatedAt):new Date()); var p=function(n){return(n<10?'0':'')+n;}; return '건강기록_백업_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json'; }
    document.getElementById('dl').onclick=function(){
      try{
        var blob=new Blob([pretty],{type:'application/json'});
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download=fname();
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }catch(e){ alert('저장이 막혀 있으면 아래 원문을 복사해 보내주세요.'); }
    };
    document.getElementById('cp').onclick=function(){
      var ta=document.getElementById('ta');
      ta.focus(); ta.select();
      var done=false;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(JSON.stringify(db)).then(function(){ alert('복사됐어요. 대화에 붙여넣어 주세요.'); },function(){ try{document.execCommand('copy');}catch(e){} alert('복사됐어요(또는 아래 원문을 직접 복사).'); });
        done=true;
      }
      if(!done){ try{document.execCommand('copy'); alert('복사됐어요. 대화에 붙여넣어 주세요.');}catch(e){ alert('아래 원문을 길게 눌러 직접 복사해주세요.'); } }
    };
  }
}
</script>
</body>
</html>
